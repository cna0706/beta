.dock{position:absolute;left:12px;right:12px;bottom:24px;height:92px;border-radius:34px;background:#ffffff40;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;justify-content:space-around;align-items:center;padding:0 6px;z-index:2}
.dock .nm{display:none}.dock .ic b{margin:0}
.lk{text-align:center;margin-top:30px}.lk .t{font-size:84px;font-weight:300;line-height:1}.lk .d{font-size:18px;margin-top:8px}
.intro{margin:auto 32px 14px;text-align:center;font-size:14px;line-height:1.6;opacity:.9;text-shadow:0 1px 4px #000a;white-space:pre-line;min-height:68px}
.nts{display:flex;flex-direction:column;gap:8px;margin:26px 12px 0;overflow:hidden}
.nt{display:flex;gap:10px;align-items:center;background:#ffffffe0;color:#111;border-radius:18px;padding:11px 13px;cursor:pointer;animation:pop .35s ease-out}
.ni{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:20px;flex:none}
.nx{flex:1;min-width:0;font-size:15px;line-height:1.4}.nx small{display:block;font-size:14px;color:#333}
.tm{font-size:12px;color:#666;align-self:flex-start}.red{color:#e5352b}
@keyframes pop{from{transform:translateY(-14px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.go{margin:0 auto 44px;border:0;background:#fff;color:#c2377a;font-size:17px;font-weight:700;padding:14px 40px;border-radius:30px;cursor:pointer}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;padding:30px 18px}
.ic{text-align:center;font-size:12px;cursor:pointer}.ic[data-app="ig"]{cursor:default;pointer-events:auto}.ic[data-app="ig"] b{filter:grayscale(.35);opacity:.72}.ic b{display:grid;place-items:center;width:62px;height:62px;border-radius:15px;margin:0 auto 6px;font-size:30px}
.hb{position:absolute;bottom:0;left:25%;width:50%;height:26px;z-index:9;cursor:pointer}
.hb::before{content:"";position:absolute;left:10%;right:10%;bottom:8px;height:5px;border-radius:3px;background:#111}
.hb.lt::before{background:#fff}
.pill{position:absolute;top:56px;right:14px;z-index:8;background:#111c;color:#fff;font-size:13px;font-weight:600;padding:6px 12px;border-radius:16px;cursor:pointer}
.hd{display:flex;align-items:center;justify-content:center;position:relative;padding:4px 14px 10px;border-bottom:1px solid #0001;font-weight:700;font-size:17px;background:#fffd}
.bk{position:absolute;left:14px;color:#0a7aff;font-weight:500;cursor:pointer}
.body{flex:1;overflow:auto;padding-bottom:34px}
.row{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #0001;cursor:pointer;align-items:center}
.av{width:44px;height:44px;border-radius:50%;background:#e6e6ee;flex:none;display:grid;place-items:center;font-size:22px}
.sub{color:#888;font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr{display:flex;gap:8px;margin:5px 10px;align-items:flex-start}.lr small{display:block;font-size:12px;margin:0 0 3px 2px;color:#333}.av.s{width:38px;height:38px;font-size:18px;border-radius:15px;flex:none}
.b{white-space:pre-line;max-width:75%;padding:9px 13px;border-radius:18px;margin:5px 12px;font-size:15px;line-height:1.45;width:fit-content}
.l{background:#e9e9ee}.r{background:#0a7aff;color:#fff;margin-left:auto}
.kt .body{background:#b2c7da}.kt .l{background:#fff}.kt .r{background:#fee500;color:#111}
.cl{border-bottom:2px dotted #e8508a;cursor:pointer}.cl.got{background:#ffe27a88;border-bottom-style:solid}
.post{margin-bottom:18px}.pu{padding:10px 14px;font-weight:700;font-size:14px}
.ph{aspect-ratio:1;display:grid;place-items:center;color:#fff;font-weight:700;text-shadow:0 1px 4px #0006}
.cap{padding:8px 14px 0;font-size:14px;line-height:1.5}.cm{padding:2px 14px;font-size:13px;color:#555}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.g3 .ph{cursor:pointer;font-size:12px;position:relative}.hrt{position:absolute;left:6px;bottom:3px;font-size:14px;color:#fff;font-style:normal;text-shadow:0 1px 3px #0009}
.note{padding:14px 16px;font-size:15px;line-height:1.6}
.toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#111e;color:#fff;font-size:14px;padding:10px 18px;border-radius:20px;z-index:30;white-space:nowrap}
.sheet{position:absolute;inset:0;z-index:20;background:#0006;display:flex;align-items:flex-end}
.card{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:20px 20px 36px;max-height:80%;overflow:auto}
.card h3{margin:0 0 12px}.card li{margin:8px 0;font-size:15px;line-height:1.5}.card ul{padding-left:20px;margin:0 0 14px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:#e8508a;color:#fff;margin-top:8px;cursor:pointer}
.btn.g{background:#eee;color:#333}.btn:disabled{opacity:.4}

.khd{display:flex;align-items:center;gap:6px;padding:4px 18px 10px;flex:none}

.ending-heading{font-size:29px;font-weight:900;letter-spacing:-1.1px;line-height:1.3;margin:0 0 28px}

  const rows=a.th.map((t,i)=>{const l=t.m[t.m.length-1],u=t.un&&!st.seen.has(i);return `<div class="kr" data-th="${i}"><div class="kav"${t.img?` style="background-image:url(${t.img})"`:""}>${t.img?"":t.e}</div><div class="km"><div class="kn">${t.n}</div><div class="kp">${plain(l[1]).replace(/\n/g," ")}</div></div><div class="kx"><span class="kt2">${l[2]}</span>${u?`<i class="bd">${t.un}</i>`:""}</div></div>`}).join("");
  return `<div class="scr">${sbar()}<div class="khd"><b class="kti">채팅</b><span class="ki">${pill}${IC.search}${IC.newc}${IC.gear}</span></div><div class="body">${rows}</div><div class="tabs">${TB.map((x,i)=>`<div class="tb${i==1?" on":""}"><div class="ti"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">${x[1]}</svg>${i==1&&un?`<i class="bd">${un}</i>`:""}</div><div>${x[0]}</div></div>`).join("")}</div></div>`;
 }
 const t=a.th[st.th];
 const msgs=t.m.map((m,j)=>{const me=m[0],p=t.m[j-1],n=t.m[j+1],first=!p||p[0]!==me,tm=(!n||n[0]!==me||n[2]!==m[2])?`<span class="tm2">${m[2]}</span>`:"";
  if(me)return `<div class="mr${first?" fs":""}">${tm}<div class="bb y">${fmt(m[1])}</div></div>`;
  return `<div class="ml${first?" fs":""}"><div class="ka"${first?(t.img?` style="background-image:url(${t.img})"`:""):` style="visibility:hidden"`}>${first&&!t.img?t.e:""}</div><div class="mc">${first?`<div class="mn">${t.n}</div>`:""}<div class="mrow">${m[1].startsWith("📞 ")?`<div class="bb w vc">${PH}<span>${m[1].slice(2)}</span></div>`:`<div class="bb w">${fmt(m[1])}</div>`}${tm}</div></div></div>`}).join("");
 return `<div class="scr kroom">${sbar()}<div class="khd"><span class="kb">${IC.back}</span><b class="kname">${t.n}</b><span class="ki">${pill}${IC.search}${IC.menu}</span></div><div class="body kbody"><div class="dp">${KDATE}</div>${msgs}</div><div class="kin">${IC.plus}<div class="pl">메시지 입력${IC.smile}</div>${IC.hash}</div></div>`;
}
function appHtml(){
 if(st.app==="kt")return ktHtml();
 const a=APPS[st.app];let h="",title=a.n,back="홈";
 if(a.t==="calls"){
  title="최근 통화";
  if(st.th==null)h=`<div class="row" data-th="0"><div class="av">💗</div><div><b class="red">한이♥ (${CALLS.length})</b><div class="sub">부재중 전화</div></div><span class="tm" style="margin-left:auto">${CALLS[CALLS.length-1]}</span></div>`;
  else{title="한이♥";back="최근 통화";h=`<div class="row" style="cursor:default"><div class="av">💗</div><div><b>한이♥</b><div class="sub">7월 7일 · 부재중 전화 ${CALLS.length}통</div></div></div>`+[...CALLS].reverse().map(t=>`<div class="row" style="cursor:default"><div><b class="red">부재중 전화</b><div class="sub">7월 7일</div></div><span class="tm" style="margin-left:auto">${t}</span></div>`).join("")}
 }else if(a.t==="list"){
  if(st.th==null){h=a.th.map((t,i)=>`<div class="row" data-th="${i}"><div class="av"${t.img?` style="background:url(${t.img}) center/cover"`:""}>${t.img?"":t.e}</div><div style="min-width:0"><b>${t.n}</b><div class="sub">${plain(t.m[t.m.length-1][1]).replace(/\n/g," ").slice(0,24)}</div></div></div>`).join("")}
  else{const t=a.th[st.th];title=t.n;back=a.n;h=`<div style="padding-top:8px">`+t.m.map((m,j)=>{if(m[0]||st.app!=="kt")return `<div class="b ${m[0]?"r":"l"}">${fmt(m[1])}</div>`;const first=!(j>0&&!t.m[j-1][0]);return `<div class="lr"><div class="av s"${!first?` style="visibility:hidden"`:t.img?` style="background:url(${t.img}) center/cover"`:""}>${t.img?"":t.e}</div><div>${first?`<small>${t.n}</small>`:""}<div class="b l" style="margin:0">${fmt(m[1])}</div></div></div>`}).join("")+`</div>`}
 }else if(a.t==="feed"){
  if(!a.p.length)h=`<div class="note" style="text-align:center;color:#888;padding-top:80px">아직 게시물이 없어요.</div>`;else h=a.p.map(p=>`<div class="post"><div class="pu">${p.u}</div><div class="ph" style="${bg(p)}">${lab(p)}</div><div class="cap"><b>${p.u}</b> ${fmt(p.cap)}</div>${p.cm.map(c=>`<div class="cm">${c}</div>`).join("")}</div>`).join("");
 }else{
  if(st.th==null)h=`<div class="g3">`+a.p.map((p,i)=>`<div class="ph" data-th="${i}" style="${bg(p)}">${lab(p)}</div>`).join("")+`</div>`;
  else{const p=a.p[st.th];back=a.n;title="사진";h=`<img src="${p.img}" style="width:100%;display:block">`}
 }
 return `<div class="scr ${st.app==="kt"?"kt":""}">${sbar()}<div class="hd"><span class="bk">‹ ${back}</span>${title}</div><div class="body">${h}</div></div>`;
}
function render(){
 let h="";
 if(st.view==="lock")h=`<div class="scr wall lt">${sbar()}<div class="lk"><div class="t">9:41</div><div class="d">7월 7일</div></div><div class="nts" id="nts">${[1,2].slice(0,st.k).map(kCard).reverse().join("")}${callCard()}</div><div class="intro"><span id="ty"></span><span class="cur"></span></div><button class="go" id="open">열어본다</button></div>`;
 else if(st.view==="home"){const E=Object.entries(APPS),ic=([k,a])=>`<div class="ic" data-app="${k}"><b class="${a.cls||""}" ${a.cls?"":`style="background:${a.bg}"`}>${a.cls?"":a.ic}</b><span class="nm">${a.n}</span></div>`;h=`<div class="scr wall lt">${sbar()}<div class="grid4">${E.filter(e=>!e[1].dock).map(ic).join("")}</div><div class="dock">${E.filter(e=>e[1].dock).map(ic).join("")}</div></div>`}
 else if(st.view==="ending"){const E=st.end?ASK.happy:ASK.bad;h=`<div class="ending-screen ${st.end?"happy":"bad"}"><div class="ending-inner"><h1 class="ending-heading">${st.end?"해피엔딩♥":"배드엔딩💔"}</h1><p class="ending-copy">${E.x}</p><button class="ending-restart" id="again">처음부터 다시</button></div></div>`}
 else h=appHtml();
 if(st.view!=="lock"&&st.view!=="ending")h+=`${st.view==="app"&&st.app==="kt"?"":pillHtml()}<div class="hb ${st.view==="home"?"lt":""}"></div>`;
 if(st.sheet==="notes"){const ok=st.got.size>=NEED;h+=`<div class="sheet" id="sh"><div class="card"><h3>단서 노트</h3><ul>${[...st.got].map(i=>`<li>${CLUES[i]}</li>`).join("")||"<li style='color:#888;list-style:none'>아직 찾은 단서가 없어요. 밑줄 친 글자를 눌러 보세요.</li>"}</ul><button class="btn" id="ask" ${ok?"":"disabled"}>${ok?"추리하기":`단서 ${NEED}개 이상 필요`}</button><button class="btn g" id="close">닫기</button></div></div>`}
 if(st.sheet==="ask")h+=`<div class="sheet"><div class="card"><h3>${ASK.q}</h3>${ASK.o.map((o,i)=>`<button class="btn g" data-o="${i}">${o[0]}</button>`).join("")}<button class="btn g" id="close" style="margin-top:14px">돌아가기</button></div></div>`;
 if(st.sheet==="res")h+=st.res?`<div class="sheet"><div class="card"><h3>🎉 추리 성공</h3><p style="line-height:1.6">${ASK.win}</p><p style="line-height:1.6;margin-top:14px">${ASK.chase}</p><button class="btn" data-end="1">예</button><button class="btn g" data-end="0">아니오</button></div></div>`:`<div class="sheet"><div class="card"><h3>🤔 다시 생각해 보자</h3><p style="line-height:1.6">${ASK.lose}</p><button class="btn" id="close">단서 다시 보기</button></div></div>`;

 P.innerHTML=h;
 if(st.view==="lock")typeIntro();
 const kb=P.querySelector(".kbody");if(kb)kb.scrollTop=kb.scrollHeight;
}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;P.appendChild(d);setTimeout(()=>d.remove(),1700)}
P.addEventListener("click",e=>{
 const q=s=>e.target.closest(s);let x;
 if(x=q(".cl")){const i=x.dataset.id;if(!st.got.has(i)){st.got.add(i);x.classList.add("got");document.getElementById("cnt").textContent=st.got.size;toast("단서 발견! "+CLUES[i])}return}
 if(q("#open")){st.view="home"}
 else if(x=q("[data-end]")){st.end=+x.dataset.end;st.sheet=null;st.view="ending"}
 else if(x=q("[data-opt],[data-o]")){if(x.dataset.o!=null){st.res=!!ASK.o[+x.dataset.o][1];st.sheet="res"}}
 else if(q("#ask")){st.sheet="ask"}
 else if(q("#again")){st.got=new Set();st.seen=new Set();st.view="lock";st.app=null;st.th=null;st.sheet=null;startNotes()}
 else if(q("#close")){st.sheet=st.sheet==="ask"?"notes":null}
 else if(q("#sh")&&!q(".card")){st.sheet=null}
 else if(q("#pill")){st.sheet="notes"}
 else if(q(".hb")){st.view="home";st.app=null;st.th=null}
 else if(x=q("[data-open]")){if(x.dataset.open==="home"){st.view="home"}else{st.view="app";st.app="kt";st.th=0;st.seen.add(0)}}
 else if(x=q("[data-app]")){if(x.dataset.app==="ig"){return}st.app=x.dataset.app;st.view="app";st.th=null}
 else if(x=q("[data-th]")){st.th=+x.dataset.th;if(st.app==="kt")st.seen.add(st.th);if(st.app==="gal"&&APPS.gal.p[st.th].fav&&!st.got.has("c2")){st.got.add("c2");render();toast("단서 발견! "+CLUES.c2);return}}
 else if(q(".bk,.kb")){if(st.th!=null)st.th=null;else{st.view="home";st.app=null}}
 else return;
 render();
});
let tyT;
function typeIntro(){clearTimeout(tyT);const el=document.getElementById("ty");if(!el)return;const txt=INTRO.replace(/<br>/g,"\n");let i=0;const step=()=>{if(!el.isConnected)return;i++;el.textContent=txt.slice(0,i);if(i<txt.length){const c=txt[i-1];tyT=setTimeout(step,c==="\n"?650:c==="…"?500:110)}};tyT=setTimeout(step,700)}
let tm=[];
function startNotes(){tm.forEach(clearTimeout);st.k=0;tm=[1500,5500].map((ms,i)=>setTimeout(()=>{st.k=i+1;const b=document.getElementById("nts");if(b&&st.view==="lock")b.insertAdjacentHTML("afterbegin",kCard(i+1))},ms))}
startNotes();render();
</script>
</body>
</html>
